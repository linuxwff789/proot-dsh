name: Build proot (NDK, package-name-agnostic)

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NDK r28
        run: |
          curl -fsSL --retry 5 -o ndk.zip https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r28b" >> $GITHUB_ENV

      - name: Build talloc static
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME"
          TBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TBIN/aarch64-linux-android26-clang"
          AR="$TBIN/llvm-ar"
          RANLIB="$TBIN/llvm-ranlib"
          mkdir -p deps/talloc
          cd deps/talloc
          curl -fsSL --retry 5 -o talloc.tar.gz https://download.samba.org/pub/talloc/talloc-2.4.3.tar.gz
          tar xzf talloc.tar.gz
          cp talloc-2.4.3/talloc.c .
          cp talloc-2.4.3/talloc.h .
          cat > replace.h <<'EOF'
#ifndef REPLACE_H
#define REPLACE_H
#include <stdio.h>
#include <stdlib.h>
#include <stdarg.h>
#include <stdint.h>
#include <string.h>
#include <stdbool.h>
#include <errno.h>
#include <unistd.h>
#include <sys/types.h>
#include <sys/auxv.h>
#define TALLOC_BUILD_VERSION_MAJOR   2
#define TALLOC_BUILD_VERSION_MINOR   4
#define TALLOC_BUILD_VERSION_RELEASE 3
#define HAVE_SYS_AUXV_H 1
#define HAVE_INTPTR_T 1
#define HAVE_VA_COPY 1
#define VALGRIND_MAKE_MEM_UNDEFINED(p, n) do { (void)(p); (void)(n); } while (0)
#define VALGRIND_MAKE_MEM_DEFINED(p, n)   do { (void)(p); (void)(n); } while (0)
#define VALGRIND_MAKE_MEM_NOACCESS(p, n)  do { (void)(p); (void)(n); } while (0)
#ifndef ZERO_STRUCT
#define ZERO_STRUCT(x) memset((char *)&(x), 0, sizeof(x))
#endif
#ifndef discard_const
#define discard_const(ptr) ((void *)((uintptr_t)(ptr)))
#endif
#ifndef MIN
#define MIN(a, b) ((a) < (b) ? (a) : (b))
#endif
#ifndef MAX
#define MAX(a, b) ((a) > (b) ? (a) : (b))
#endif
#define HAVE_CONSTRUCTOR_ATTRIBUTE 1
#endif
EOF
          $CC -c talloc.c -o talloc.o -I. -fPIC -O2 -Wall -std=gnu99 \
            -DHAVE_STDARG_H=1 -DHAVE_VA_COPY=1 -DHAVE_UNISTD_H=1 -DHAVE_INTPTR_T=1
          $AR rcs libtalloc.a talloc.o
          $RANLIB libtalloc.a
          echo "talloc built: $(ls -la libtalloc.a)"

      - name: Build proot + loader
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME"
          TBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TBIN/aarch64-linux-android26-clang"
          AR="$TBIN/llvm-ar"
          STRIP="$TBIN/llvm-strip"
          make -C src -f GNUmakefile clean >/dev/null 2>&1 || true
          make -C src -f GNUmakefile \
            CC="$CC" AR="$AR" STRIP="$STRIP" \
            TALLOC_LIBS="$PWD/deps/talloc/libtalloc.a" \
            proot loader/loader 2>&1 | tail -25
          mkdir -p dist
          cp src/proot dist/libproot.so
          cp src/loader/loader dist/libproot-loader.so
          if [ -f src/loader/loader-m32 ]; then cp src/loader/loader-m32 dist/libproot-loader32.so; fi
          $STRIP dist/libproot.so dist/libproot-loader.so 2>/dev/null || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proot-dsh-arm64
          path: dist/
          retention-days: 30
